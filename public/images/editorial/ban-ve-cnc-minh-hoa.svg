<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ một chi tiết ván cần gia công CNC</title>
<desc id="desc">Hình nhìn từ mặt gia công, có đường bao, lỗ khoan, rãnh, cạnh chuẩn và các đường chỉ kích thước. Hình không theo tỉ lệ và không quy định kích thước thực.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#355444"/></marker></defs>
<rect width="1200" height="820" fill="#f5f7f3"/>
<g font-family="Arial, sans-serif" fill="#153a29"><text x="56" y="64" font-size="30" font-weight="700">Một chi tiết nhìn từ mặt gia công</text><text x="56" y="101" font-size="22">Sơ đồ minh họa · không theo tỉ lệ</text></g>
<rect x="225" y="215" width="690" height="400" fill="#fff" stroke="#173e2b" stroke-width="5"/>
<circle cx="765" cy="300" r="30" fill="none" stroke="#aa5420" stroke-width="5"/><path d="M725 300h80 M765 260v80" stroke="#aa5420" stroke-width="2"/>
<rect x="355" y="488" width="400" height="25" fill="#e9d5c4" stroke="#aa5420" stroke-width="3"/>
<g stroke="#355444" stroke-width="2" fill="none"><path d="M225 186V151 M915 186V151 M225 165H915" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M190 215H153 M190 615H153 M166 215V615" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M765 215V125 M915 300H1050 M755 500H1030 M225 615L125 682" stroke-dasharray="7 6"/><path d="M225 300H765" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g>
<g font-family="Arial, sans-serif" fill="#153a29" font-size="22"><text x="482" y="145">Chiều rộng thành phẩm</text><text transform="translate(133 525) rotate(-90)">Chiều cao thành phẩm</text><text x="380" y="287">Vị trí tâm lỗ từ cạnh chuẩn</text><text x="782" y="119">Vị trí tâm lỗ</text><text x="936" y="290">Lỗ khoan</text><text x="936" y="318">đường kính, độ sâu</text><text x="935" y="490">Rãnh</text><text x="935" y="518">rộng, sâu, vị trí</text><text x="55" y="716">Cạnh chuẩn để đo</text><text x="225" y="663">Mặt gia công: ghi rõ mặt trước hoặc mặt sau</text><text x="55" y="777" font-size="20">Kích thước, mặt gia công và đơn vị phải theo bản vẽ thực tế.</text></g>
</svg>
