name: Optimize CMS Images

on:
  push:
    branches: ["cms/**"]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run images:optimize
      - run: npm run images:check
      - name: Commit optimized images when needed
        run: |
          if [[ -n "$(git status --porcelain -- public/uploads public/uploads-thumbnails content)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/uploads public/uploads-thumbnails content
            git commit -m "chore(cms): optimize uploaded images"
            git push
          else
            echo "No image changes."
          fi
