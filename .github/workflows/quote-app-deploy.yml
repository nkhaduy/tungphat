name: Quote App Production Deploy

on:
  push:
    branches:
      - codex/quote-payment-flow
    paths:
      - "quote-app/**"
      - ".github/workflows/quote-app-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quote-app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quote-app/package-lock.json
      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run build:pages
      - name: Deploy production
        run: npx wrangler pages deploy dist/client --project-name tungphat-quotes --branch main --commit-hash "$GITHUB_SHA" --commit-message "Format VND with dot thousand separators"
