name: CI

# Cloudflare's existing Git integration is the sole automatic deployment
# pipeline. It runs npm run verify before deploying main or an allowed preview.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'quote-app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_ANALYTICS_TEST_MODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            payload-cms/package-lock.json
      - run: npm ci
      - run: npm ci --prefix payload-cms
      - run: npm run verify
      - run: npm run media:check-git
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
          retention-days: 7

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix payload-cms
      - uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list
