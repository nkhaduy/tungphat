name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix payload-cms
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix payload-cms run lint
      - run: npm --prefix payload-cms run typecheck
      - run: npm --prefix payload-cms run integration
      - run: npm --prefix payload-cms run build:cloudflare
      - run: npm --prefix payload-cms run verify
      - run: npm run validate:content
      - run: npm run images:check
      - run: npm run media:check-git
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run validate:links
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_ANALYTICS_TEST_MODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
